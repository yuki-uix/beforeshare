name: contracts

# The guards this workflow runs are the point of the schemas: enum drift, example
# ordering, severity floors, masking rules, and the negative cases. Running them
# only on a contributor's machine would make them documentation, not enforcement.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-shell-is-parseable:
    name: embedded shell parses
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      # A merge once left this file valid as YAML while dropping the line that
      # opened a `node -e "` block. The shell inside stopped parsing there, so the
      # last guard and the control case never ran - and the job still reported the
      # eight lines before it. YAML validation cannot see inside a run block, and
      # neither can npm test. bash -n can.
      - name: Every run block must parse as shell
        run: |
          python3 - <<'PY' > /tmp/blocks.json
          import json, yaml
          w = yaml.safe_load(open('.github/workflows/contracts.yml'))
          out = []
          for jname, job in w['jobs'].items():
              for i, step in enumerate(job.get('steps', [])):
                  if 'run' in step:
                      out.append({'job': jname, 'step': step.get('name', f'#{i}'), 'run': step['run']})
          json.dump(out, open('/tmp/blocks.json', 'w'))
          PY
          python3 - <<'PY'
          import json, subprocess, sys, tempfile, os
          blocks = json.load(open('/tmp/blocks.json'))
          if not blocks:
              print('::error::no run blocks found; this check would pass vacuously')
              sys.exit(1)
          failed = 0
          for b in blocks:
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as f:
                  f.write(b['run'])
                  path = f.name
              r = subprocess.run(['bash', '-n', path], capture_output=True, text=True)
              os.unlink(path)
              if r.returncode != 0:
                  failed += 1
                  print(f"::error::{b['job']} / {b['step']}: {r.stderr.strip()}")
              else:
                  print(f"ok  {b['job']} / {b['step']}")
          print(f"\n{'PASS' if failed == 0 else 'FAIL'}  {len(blocks)} run blocks, {failed} failure(s)")
          sys.exit(1 if failed else 0)
          PY

  validate:
    name: schemas and masking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm ci fails loudly when package.json and package-lock.json disagree,
      # which npm install would quietly paper over.
      - run: npm ci

      - name: Validate schemas, examples and enum drift
        run: npm run validate

      - name: Test masking rules
        run: npm run test:masking

      - name: Test status rules and exit codes
        run: npm run test:status

      - name: Test contract boundaries
        run: npm run test:contracts

      - name: Test the path safety gate
        run: npm run test:path-gate

      - name: Test file identity binding
        run: npm run test:identity

      - name: Test immutable output
        run: npm run test:output

      - name: Test failure semantics
        run: npm run test:failure

      - name: Test temporary file lifetime
        run: npm run test:temp

      - name: Test run registry
        run: npm run test:registry

      - name: Test resource limits
        run: npm run test:limits

      - name: Test PDF fixtures
        run: npm run test:fixtures

      - name: Test PDF detection rules
        run: npm run test:detection

      # Last, because it runs the others and reads what they reported.
      - name: Every §20.2 boundary is covered or owed
        run: npm run test:boundaries

  guards-are-effective:
    name: guards fail when they should
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # A guard that cannot fail is worse than no guard: it reports coverage that
      # does not exist.
      #
      # Each case below breaks one invariant and asserts the suite goes red *for
      # the expected reason*. Asserting only that it goes red would accept any
      # failure at all — a malformed mutation, a missing dependency, a bad path —
      # as proof the guard works. That is the same mistake the guards exist to
      # prevent, so the expected message is matched explicitly.
      - name: Guards reject what they are supposed to reject
        run: |
          set -uo pipefail

          # $4 is the npm script that should notice the mutation. It defaults to
          # validate because most guards live there, but a mutation checked by a
          # different suite would otherwise run the wrong command and report that
          # the guard had stopped working.
          expect_failure() {
            local label="$1" expected="$2" file="$3" suite="${4:-validate}"
            local out status

            out=$(npm run "$suite" --silent 2>&1)
            status=$?

            if [ "$status" -eq 0 ]; then
              echo "::error::${label}: the suite passed; this guard no longer checks anything"
              restore "$file"
              return 1
            fi

            # Match only FAIL lines. Searching the whole output let an expected
            # string match a passing line - "example capabilities.json" appears in
            # `ok example capabilities.json (...)` - so the case reported the right
            # reason while proving only that something failed. That is the same
            # false green this job exists to prevent, reintroduced through a
            # too-general match.
            #
            # The FAIL lines are captured, then matched with shell pattern
            # matching rather than a pipe into grep -q. Under pipefail, grep -q
            # exits on its first match, its upstream takes SIGPIPE, and the
            # pipeline reports failure even though the string was found. It only
            # shows up once the suite prints enough lines for the pipe to still be
            # filling: measured fine at ~370 lines and broken at 5000, so it would
            # have started failing as the suite grew. `case` runs in the shell
            # itself and has no pipe to break.
            local failures
            failures=$(printf '%s\n' "$out" | grep '^FAIL' || true)

            case "$failures" in
              *"$expected"*) ;;
              *)
                echo "::error::${label}: the suite failed, but not for the expected reason."
                echo "::error::expected to find: ${expected}"
                printf '%s\n' "$out" | tail -20
                restore "$file"
                return 1
                ;;
            esac

            echo "ok  ${label}"
            cases_run=$((cases_run + 1))
            restore "$file"
          }

          # git checkout fails silently on a path git does not track. A mutation
          # that is never undone poisons every later case AND the control, which
          # is how this script first went wrong locally. Restoration is verified.
          # Every case restores with `git checkout --`, which discards whatever is
          # in the working tree. In CI the tree is always clean; run locally on a
          # dirty one and it deletes the work being tested. That has happened
          # twice here, and the second time took a whole protocol rewrite with
          # it, so the script refuses rather than relying on remembering.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::the working tree has uncommitted changes; this script restores with git checkout and would discard them"
            exit 1
          fi

          # Takes one or more paths, space separated: a mutation can span files,
          # and the interesting ones do - deleting a safety boundary means
          # editing the requirement and the claim about it together.
          restore() {
            local f
            for f in $1; do
              if ! git checkout -- "$f" 2>/dev/null || ! git diff --quiet -- "$f"; then
                echo "::error::could not restore ${f} after mutating it; later cases are unreliable"
                exit 1
              fi
            done
          }

          failed=0
          cases_run=0

          # The number of cases this step must run. bash -n proved necessary but
          # not sufficient: a merge that swallowed a `node -e "` line once left the
          # script syntactically valid while one case vanished into a quoted
          # string, and the step reported the remaining ones as if nothing were
          # missing. A case that silently disappears now fails the job.
          EXPECTED_CASES=74

          node -e "
            const fs=require('fs'), p='schemas/v1/enums.schema.json';
            const s=JSON.parse(fs.readFileSync(p,'utf8'));
            s.\$defs.category.enum.push('pii_invented_for_ci');
            fs.writeFileSync(p, JSON.stringify(s,null,2));
          "
          expect_failure "undeclared category" \
            "every category has a defaults row" \
            "schemas/v1/enums.schema.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/review-required.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.findings.reverse();
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "reversed example" \
            "review-required.json findings follow the documented ordering" \
            "schemas/v1/examples/review-required.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/evidence.schema.json';
            const s=JSON.parse(fs.readFileSync(p,'utf8'));
            delete s.properties.displayValue.maxLength;
            s.additionalProperties = true;
            fs.writeFileSync(p, JSON.stringify(s,null,2));
          "
          expect_failure "removed schema constraint" \
            "negative case was ACCEPTED" \
            "schemas/v1/evidence.schema.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/partial.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.status='no_findings';
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "example declaring a status the rules do not produce" \
            "declares the status the rules produce" \
            "schemas/v1/examples/partial.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/detector-registry.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.detectors['pdf.invented_for_ci']={mediaTypes:['application/pdf'],version:'1.0.0',emits:['annotation'],certainty:'deterministic'};
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "detector added without regenerating capabilities" \
            "matches the one generated from the registry" \
            "schemas/v1/detector-registry.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/capabilities.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.formats[0].testedLimits.maxTestedSizeBytes=104857600;
            fs.writeFileSync(p, JSON.stringify(c,null,2));
          "
          expect_failure "an untested limit smuggling in a number" \
            "application/pdf declares its untested limits explicitly" \
            "schemas/v1/examples/capabilities.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/capabilities.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            const d=c.formats[0].detectors[0];
            d.status='implemented'; delete d.waitingOn;
            fs.writeFileSync(p, JSON.stringify(c,null,2));
          "
          expect_failure "a detector claiming to exist without an adapter" \
            "application/pdf detector pdf.metadata declares its implementation state" \
            "schemas/v1/examples/capabilities.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/verification-unable.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.results[0].readPaths[0].reader='verify.does_not_exist';
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "a verification example naming an unregistered reader" \
            "names only registered readers" \
            "schemas/v1/examples/verification-unable.json" || failed=1
          node -e "
            const fs=require('fs'), p='schemas/v1/examples/no-findings.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.coverage.completed = r.coverage.completed.filter(d => d !== 'ocr.visible_text');
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "a detector left out of coverage entirely" \
            "accounts for every detector applicable to" \
            "schemas/v1/examples/no-findings.json" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/interface-registry.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.interfaces.cli.status='implemented';
            delete r.interfaces.cli.waitingOn;
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "an interface claiming to exist without an adapter" \
            "interface cli names an adapter" \
            "schemas/v1/interface-registry.json" \
            "test:contracts" || failed=1

          node -e "
            const fs=require('fs'), p='schemas/v1/examples/no-findings.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            r.coverage.skipped.push({ detector: r.coverage.completed[0], reason: 'cancelled' });
            fs.writeFileSync(p, JSON.stringify(r,null,2));
          "
          expect_failure "a detector reported in two coverage states at once" \
            "reports each detector in exactly one coverage state" \
            "schemas/v1/examples/no-findings.json" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('if (caseInsensitive) key = key.toLowerCase();','');
            fs.writeFileSync(p, s);
          "
          expect_failure "a gate that ignores the volume's case rules" \
            "an authorised root is matched case-insensitively" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('!issued.has(value)','false');
            fs.writeFileSync(p, s);
          "
          expect_failure "a gate whose brand check always passes" \
            "a hand-built path object cannot be read" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('    const target = resolveThroughMissingTail(fs, collapsed);','    const target = maybeRealpath(fs, collapsed) ?? collapsed;');
            fs.writeFileSync(p, s);
          "
          expect_failure "a gate trusting the lexical path when the leaf is missing" \
            "a missing file under an escaping link is refused for writing" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  if (resolved.handle !== undefined) return fs.readHandle(resolved.handle);','');
            fs.writeFileSync(p, s);
          "
          expect_failure "a read that re-resolves the path instead of using its handle" \
            "a replaced component does not change what a bound read returns" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  if (now !== approval.inputSha256) {','  if (false) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "an approval that survives a change to its input" \
            "an approval does not survive a change to the input" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  if (issuedRunIds.has(runId)) {','  if (false) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "an intake that lets one run identifier name two inspections" \
            "a run identifier already in use is refused" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(' || !confirmedInspections.has(confirmedInspection)','');
            fs.writeFileSync(p, s);
          "
          expect_failure "an approval taken straight off an intake record" \
            "an intake record cannot be approved without a confirmation" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          # The rule-table check used to compare a file with itself, so a reason
          # nothing throws read as consistent. This mutation adds exactly that.
          node -e "
            const fs=require('fs'), p='schemas/v1/identity-rules.json';
            const t=JSON.parse(fs.readFileSync(p,'utf8'));
            t.rejectionReasons.never_thrown_anywhere={rationale:'a rule the implementation does not enforce, declared as though it did'};
            fs.writeFileSync(p, JSON.stringify(t,null,2)+'\\n');
          "
          expect_failure "a declared rejection reason no code path throws" \
            "every declared reason is thrown somewhere in file-identity.mjs" \
            "schemas/v1/identity-rules.json" \
            "validate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  assertSamePath(approval, resolvedPath);','');
            fs.writeFileSync(p, s);
          "
          expect_failure "an approval honoured for a file it was not granted for" \
            "an approval does not authorise sanitizing an identical other file" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  if (retiredRunIds.has(runId)) {','  if (false) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "a spent run identifier handed out again" \
            "a released identifier is still refused" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          node -e "
            const fs=require('fs'), p='tools/file-identity.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('const bytes = copyOf(readFile(fs, resolvedPath));','const bytes = readFile(fs, resolvedPath);');
            fs.writeFileSync(p, s);
          "
          expect_failure "a record hashing the adapter's own mutable buffer" \
            "the adapter writing through its own reference does not change the record" \
            "tools/file-identity.mjs" \
            "test:identity" || failed=1

          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('      if (published) return destination.path;','      if (published) { fs.write(claim.input.path, bytes); return destination.path; }');
            fs.writeFileSync(p, s);
          "
          expect_failure "a publish that also lands on the original" \
            "remove_pdf_metadata_field leaves the original unchanged" \
            "tools/output-naming.mjs" \
            "test:output" || failed=1

          # Asking whether a name is free and then using it is the concurrent
          # defect. The vector races the create, so only a real claim survives it.
          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('      published = fs.link(claim.temp.path, destination.path);','      published = fs.write(destination.path, bytes) || true;');
            fs.writeFileSync(p, s);
          "
          expect_failure "a publish that replaces whatever is at the destination" \
            "a destination that appeared after the claim is not replaced" \
            "tools/output-naming.mjs" \
            "test:output" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('    forWrite(raw, opts) {','    forWrite(raw, opts = { input: null }) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "an output path resolvable for writing without declaring its input" \
            "an output resolved without declaring its input is refused" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('    if (fs.createExclusive(temp.path, { mode: TEMP_MODE })) {','    if (true) { fs.createExclusive(temp.path, { mode: TEMP_MODE });');
            fs.writeFileSync(p, s);
          "
          expect_failure "a reservation that takes a temporary name already in use" \
            "a busy temporary name moves the run to the next candidate" \
            "tools/output-naming.mjs" \
            "test:output" || failed=1

          node -e "
            const fs=require('fs'), p='tools/path-gate.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('      if (input !== null) {','      if (input !== null && input !== undefined) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "an undefined input declaration skipping the refusal" \
            "an output whose declared input is undefined is refused" \
            "tools/path-gate.mjs" \
            "test:path-gate" || failed=1

          # The stub has to behave like the filesystem, or the vectors above
          # prove something no filesystem does. It has happened here before.
          node -e "
            const fs=require('fs'), p='tools/test-output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('files.has(p) || Object.hasOwn(links, p) ? false','files.has(p) ? false');
            fs.writeFileSync(p, s);
          "
          expect_failure "a stub whose exclusive create follows symlinks" \
            "exclusive create on a symlink agrees with node:fs" \
            "tools/test-output-naming.mjs" \
            "test:output" || failed=1

          # Creating the temporary file before the gate has looked at it also
          # refuses a planted link, but by creating a file at an unvetted path
          # first and calling an escape attempt a busy name.
          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('    const temp = gate.forWrite(\`\${candidates[i].path}.part\`, { input });','    if (!fs.createExclusive(\`\${candidates[i].path}.part\`, { mode: TEMP_MODE })) { continue; }\n    const temp = gate.forWrite(\`\${candidates[i].path}.part\`, { input });');
            s=s.replace('    if (fs.createExclusive(temp.path, { mode: TEMP_MODE })) {','    if (true) {');
            fs.writeFileSync(p, s);
          "
          expect_failure "a temporary name claimed before the gate saw it" \
            "a link planted at the temporary name is refused" \
            "tools/output-naming.mjs" \
            "test:output" || failed=1

          node -e "
            const fs=require('fs'), p='tools/failure-semantics.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(\"if (code === 'EACCES' || code === 'EPERM' || code === 'EROFS') return 'permission_denied';\",'');
            fs.writeFileSync(p, s);
          "
          expect_failure "a permission failure folded into the unclassified one" \
            "EACCES is reported as permission_denied" \
            "tools/failure-semantics.mjs" \
            "test:failure" || failed=1

          # §17.4 reports cancellation latency. Zero for a run that never
          # stopped would make the least responsive build look like the fastest.
          node -e "
            const fs=require('fs'), p='tools/failure-semantics.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('return requestedAt === null || observedAt === null ? null : observedAt - requestedAt;','return requestedAt === null ? null : (observedAt ?? requestedAt) - requestedAt;');
            fs.writeFileSync(p, s);
          "
          expect_failure "a cancellation latency of zero for a run that never stopped" \
            "a cancel that is never noticed reports no latency, not zero" \
            "tools/failure-semantics.mjs" \
            "test:failure" || failed=1

          # A reservation left behind by every failed attempt makes that
          # destination name unreachable for good.
          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('  } finally {\n    discard(fs, claim);\n  }','  } finally {\n    /* the reservation is kept */\n  }');
            fs.writeFileSync(p, s);
          "
          expect_failure "a run that keeps the name it reserved after failing or being cancelled" \
            "a failed attempt releases the name it reserved" \
            "tools/output-naming.mjs" \
            "test:failure" || failed=1

          # A crash modelled as a thrown error unwinds through the module's own
          # finally, whose cleanup removes the debris - which is what a dead
          # process cannot do. The vectors then check an empty list and pass.
          node -e "
            const fs=require('fs'), p='tools/test-failure-semantics.mjs';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('        self.deathSnapshot = new Map(files);','        self.deathSnapshot = files;');
            fs.writeFileSync(p, s);
          "
          expect_failure "a crash whose debris the cleanup is allowed to remove" \
            "during_write: the crash really did leave the partial bytes behind" \
            "tools/test-failure-semantics.mjs" \
            "test:failure" || failed=1

          # during_publish only runs when a candidate is refused, so a clean run
          # never reaches it and a shorter list of visited points looks fine.
          node -e "
            const fs=require('fs'), p='tools/output-naming.mjs';
            let s=fs.readFileSync(p,'utf8');
