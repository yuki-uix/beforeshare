[package]
name = "beforeshare-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The command line over the core: §12's commands, §12.2's exit codes, and nothing the core does not already answer."
publish = false

[[bin]]
name = "beforeshare"
path = "src/main.rs"

[dependencies]
beforeshare-core = { path = "../core" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
