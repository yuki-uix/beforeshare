[package]
name = "pdf-parser-bakeoff"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately not a member of the core crate, and not under its lints. The
# question here is what each parser can see; whether a parser may then be used
# in a crate that forbids unsafe is a separate decision, and mixing the two
# would let a policy settle a measurement.

[dependencies]
lopdf = { version = "0.45", default-features = false }
serde_json = "1"
