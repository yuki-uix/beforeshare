[package]
name = "beforeshare-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The core inspection API §14 draws under the three interfaces. Rules live in schemas/v1/*.json and are read from there, not copied."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "0.38", features = ["fs"] }
# ADR 0002. Loaded with `strict: true`: lenient parsing returns Ok with zero
# objects for a file whose cross-reference offsets are wrong, and a checker that
# trusts Ok would report "no findings" about a document it never read.
lopdf = { version = "0.45", default-features = false }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# So a test can read a fixture's own structure instead of restating it from
# memory - which is how "every metadata field" came to include one the fixture
# does not have.
lopdf = { version = "0.45", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
