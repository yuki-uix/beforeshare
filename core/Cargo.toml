[package]
name = "beforeshare-core"
version = "0.1.0"
edition = "2021"
# 1.88 because lopdf 0.45 declares it. The crate said 1.85, which no longer
# built - a declared minimum that is not the real one tells a contributor their
# toolchain is fine right up until it is not.
rust-version = "1.88"
description = "The core inspection API §14 draws under the three interfaces. Rules live in schemas/v1/*.json and are read from there, not copied."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "0.38", features = ["fs"] }
# ADR 0002. Loaded with `strict: true`: lenient parsing returns Ok with zero
# objects for a file whose cross-reference offsets are wrong, and a checker that
# trusts Ok would report "no findings" about a document it never read.
lopdf = { version = "0.45", default-features = false }
# §14.1 binds the three stages by hash, and every interface needs the same
# answer for the same bytes. One implementation, in the core, rather than one
# per interface.
sha2 = "0.10"

[dev-dependencies]
# So a test can build a real compression bomb. A stored-block "deflate" written
# by hand compresses nothing, and the test would have measured file size rather
# than expansion - which is the thing the budget bounds.
flate2 = "1"
tempfile = "3"
serde_json = "1"
# So a test can read a fixture's own structure instead of restating it from
# memory - which is how "every metadata field" came to include one the fixture
# does not have.
lopdf = { version = "0.45", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
